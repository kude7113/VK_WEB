<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>

    <nav class="navbar navbar-expand-lg border-bottom border-secondary bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Navbar</a>

            <div class="d-flex gap-2 align-items-center">

                        </div>
                    </div>

                    <div class="row mb-3 ">
                        <label for="inputEmail" class="col-sm-3 col-form-label">Email</label>
                        <div class="col-sm-5">
                            <input type="text" class="form-control" id="inputEmail" placeholder="Enter your email">
                        </div>
                    </div>
                    
                    <div class="row mb-3 ">
                        <label for="inputEmail" class="col-sm-3 col-form-label">Username</label>

                            </div>
                            <div class="row">
                                <div class="col-sm-4 mb-3">
                                    <input type="text" class="form-control" placeholder="" value="C:\avatar.jpg" readonly>
                                </div>
                                <div class="col">   
                                    <button class="btn btn-outline-success" type="submit">Choose</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                         <button class="btn btn-outline-secondary" type="submit">Ask</button>
                    </div>
                </div>

            </section>

            <aside class="col-3">

                <section class="mb-3">
                    <h3>Popular tags</h3>
                    <div>
                        <span class="badge rounded-pill text-bg-primary">Primary</span>
                        <span class="badge rounded-pill text-bg-secondary">Secondary</span>
                        <span class="badge rounded-pill text-bg-success">Success</span>
                        <span class="badge rounded-pill text-bg-danger">Danger</span>
                        <span class="badge rounded-pill text-bg-warning">Warning</span>
                        <span class="badge rounded-pill text-bg-info">Info</span>
                        <span class="badge rounded-pill text-bg-light">Light</span>
                        <span class="badge rounded-pill text-bg-dark">Dark</span>
                    </div>

                <section>
